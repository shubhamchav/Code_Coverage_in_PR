name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  code-quality: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build + Test
        run: mvn clean verify

      # Generates:
      # target/site/jacoco/jacoco.xml

      - name: Convert JaCoCo to Cobertura
        run: |
          curl -fsSL https://raw.githubusercontent.com/mwalliczek/jacoco2cobertura/master/cover2cover.py -o /tmp/cover2cover.py
          python3 /tmp/cover2cover.py target/site/jacoco/jacoco.xml src/main/java > target/site/cobertura.xml

      - name: Upload coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: target/site/cobertura.xml
          language: Java
          label: code-coverage/jacoco
          fail-on-error: false
