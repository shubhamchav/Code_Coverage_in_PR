name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  code-quality: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build + Test
        run: mvn clean verify

      # Generates:
      # target/site/jacoco/jacoco.xml

      - name: Convert JaCoCo to Cobertura
        run: |
          curl -fsSL https://raw.githubusercontent.com/mwalliczek/jacoco2cobertura/master/cover2cover.py -o /tmp/cover2cover.py
          python3 /tmp/cover2cover.py target/site/jacoco/jacoco.xml src/main/java > target/site/cobertura.xml

      - name: Upload coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          report: target/site/cobertura.xml
          language: Java
          label: code-coverage/jacoco
