name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  code-quality: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build + Test
        run: mvn clean verify

      # Your existing JaCoCo report already generated here

      - name: Convert JaCoCo to Cobertura
        run: |
          pip install jacoco2cobertura
          python -m jacoco2cobertura \
            target/site/jacoco/jacoco.xml \
            --output target/site/cobertura.xml

      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          files: target/site/cobertura.xml
